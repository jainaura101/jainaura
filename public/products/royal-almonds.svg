<svg width="600" height="700" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-ra" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fdf7f0"/>
      <stop offset="100%" stop-color="#eeddc5"/>
    </linearGradient>
    <linearGradient id="jar-ra" x1="0.1" x2="0.9" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf4"/>
      <stop offset="55%" stop-color="#f7ead8"/>
      <stop offset="100%" stop-color="#e0c9ac"/>
    </linearGradient>
    <linearGradient id="label-ra" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1E4D2B"/>
      <stop offset="100%" stop-color="#2d6b3d"/>
    </linearGradient>
    <filter id="shadow-ra">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#7a5525" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#bg-ra)"/>

  <!-- Jar -->
  <rect x="145" y="190" width="310" height="370" rx="38" fill="url(#jar-ra)" filter="url(#shadow-ra)"/>
  <!-- Glass highlight -->
  <rect x="162" y="205" width="28" height="330" rx="14" fill="rgba(255,255,255,0.52)"/>

  <!-- Lid — gold -->
  <rect x="133" y="156" width="334" height="48" rx="24" fill="#b98d4d"/>
  <rect x="153" y="164" width="294" height="18" rx="9" fill="#e8c98a" opacity="0.55"/>

  <!-- Label -->
  <rect x="170" y="275" width="260" height="155" rx="12" fill="url(#label-ra)"/>
  <text x="300" y="312" text-anchor="middle" font-size="20" fill="#c9a86c" font-family="Georgia,serif">✦ ✦</text>
  <text x="300" y="340" text-anchor="middle" font-size="12" fill="#f0e8d8" font-family="Georgia,serif" letter-spacing="3">JAIN AURA</text>
  <text x="300" y="365" text-anchor="middle" font-size="17" fill="#ffffff" font-family="Georgia,serif" font-weight="600">Royal</text>
  <text x="300" y="387" text-anchor="middle" font-size="17" fill="#ffffff" font-family="Georgia,serif" font-weight="600">Almonds</text>
  <text x="300" y="411" text-anchor="middle" font-size="10" fill="#c9a86c" font-family="Arial,sans-serif" letter-spacing="2">500g • PREMIUM</text>

  <!-- Almonds spilling from top -->
  <!-- Almond shapes (elongated ellipses) -->
  <ellipse cx="238" cy="252" rx="30" ry="16" fill="#d4a256" transform="rotate(-25,238,252)"/>
  <ellipse cx="285" cy="242" rx="32" ry="15" fill="#c49044" transform="rotate(10,285,242)"/>
  <ellipse cx="332" cy="248" rx="28" ry="14" fill="#b87d38" transform="rotate(-15,332,248)"/>
  <ellipse cx="370" cy="255" rx="22" ry="12" fill="#d4a256" transform="rotate(20,370,255)"/>
  <!-- Almond highlight -->
  <ellipse cx="281" cy="237" rx="9" ry="5" fill="rgba(255,255,255,0.38)" transform="rotate(10,281,237)"/>
  <ellipse cx="335" cy="243" rx="8" ry="4" fill="rgba(255,255,255,0.32)" transform="rotate(-15,335,243)"/>

  <!-- Scattered almonds below -->
  <ellipse cx="175" cy="585" rx="20" ry="10" fill="#c49044" opacity="0.5" transform="rotate(-30,175,585)"/>
  <ellipse cx="420" cy="578" rx="18" ry="9" fill="#d4a256" opacity="0.5" transform="rotate(20,420,578)"/>
  <ellipse cx="195" cy="615" rx="15" ry="8" fill="#b87d38" opacity="0.45" transform="rotate(-10,195,615)"/>
  <ellipse cx="400" cy="608" rx="17" ry="9" fill="#c49044" opacity="0.5" transform="rotate(30,400,608)"/>

  <!-- Weight badge -->
  <rect x="228" y="592" width="144" height="34" rx="17" fill="rgba(30,77,43,0.1)" stroke="#1E4D2B" stroke-width="1" stroke-opacity="0.28"/>
  <text x="300" y="615" text-anchor="middle" font-size="11" fill="#1E4D2B" font-family="Arial,sans-serif" letter-spacing="2" font-weight="600">NET WT. 500g</text>
</svg>
