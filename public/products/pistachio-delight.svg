<svg width="600" height="700" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-pd" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6f9f0"/>
      <stop offset="100%" stop-color="#e3edd8"/>
    </linearGradient>
    <linearGradient id="jar-pd" x1="0.1" x2="0.9" y1="0" y2="1">
      <stop offset="0%" stop-color="#fafff6"/>
      <stop offset="55%" stop-color="#eef5e4"/>
      <stop offset="100%" stop-color="#d4e8c0"/>
    </linearGradient>
    <linearGradient id="label-pd" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1E4D2B"/>
      <stop offset="100%" stop-color="#162a1d"/>
    </linearGradient>
    <filter id="shadow-pd">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2a5a1e" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#bg-pd)"/>

  <!-- Jar body -->
  <rect x="148" y="185" width="304" height="375" rx="40" fill="url(#jar-pd)" filter="url(#shadow-pd)"/>
  <!-- Glass highlight -->
  <rect x="165" y="200" width="26" height="340" rx="13" fill="rgba(255,255,255,0.5)"/>

  <!-- Lid — deep green -->
  <rect x="136" y="152" width="328" height="46" rx="23" fill="#2d6b3d"/>
  <rect x="156" y="160" width="288" height="16" rx="8" fill="#4a9960" opacity="0.5"/>

  <!-- Label -->
  <rect x="172" y="270" width="256" height="158" rx="13" fill="url(#label-pd)"/>
  <text x="300" y="307" text-anchor="middle" font-size="19" fill="#c9a86c" font-family="Georgia,serif">❧</text>
  <text x="300" y="334" text-anchor="middle" font-size="12" fill="#f0e8d8" font-family="Georgia,serif" letter-spacing="3">JAIN AURA</text>
  <text x="300" y="360" text-anchor="middle" font-size="17" fill="#ffffff" font-family="Georgia,serif" font-weight="600">Pistachio</text>
  <text x="300" y="382" text-anchor="middle" font-size="17" fill="#ffffff" font-family="Georgia,serif" font-weight="600">Delight</text>
  <text x="300" y="408" text-anchor="middle" font-size="10" fill="#c9a86c" font-family="Arial,sans-serif" letter-spacing="2">500g • FRESH</text>

  <!-- Pistachios at top (green shells) -->
  <ellipse cx="236" cy="250" rx="26" ry="18" fill="#7ab040" transform="rotate(-20,236,250)"/>
  <ellipse cx="280" cy="238" rx="30" ry="20" fill="#5e8d2a" transform="rotate(5,280,238)"/>
  <ellipse cx="330" cy="244" rx="28" ry="17" fill="#8abf4a" transform="rotate(-12,330,244)"/>
  <ellipse cx="370" cy="253" rx="22" ry="15" fill="#7ab040" transform="rotate(18,370,253)"/>

  <!-- Shell crack highlight -->
  <line x1="276" y1="233" x2="288" y2="243" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="283" cy="234" rx="7" ry="4" fill="rgba(255,255,255,0.3)" transform="rotate(5,283,234)"/>

  <!-- Scattered below -->
  <ellipse cx="178" cy="580" rx="18" ry="11" fill="#7ab040" opacity="0.5" transform="rotate(-25,178,580)"/>
  <ellipse cx="415" cy="590" rx="16" ry="10" fill="#5e8d2a" opacity="0.48" transform="rotate(15,415,590)"/>
  <ellipse cx="195" cy="612" rx="14" ry="9" fill="#8abf4a" opacity="0.45" transform="rotate(-10,195,612)"/>
  <ellipse cx="395" cy="575" rx="20" ry="12" fill="#7ab040" opacity="0.5" transform="rotate(28,395,575)"/>

  <!-- Weight badge -->
  <rect x="226" y="590" width="148" height="34" rx="17" fill="rgba(30,77,43,0.1)" stroke="#1E4D2B" stroke-width="1" stroke-opacity="0.28"/>
  <text x="300" y="613" text-anchor="middle" font-size="11" fill="#1E4D2B" font-family="Arial,sans-serif" letter-spacing="2" font-weight="600">NET WT. 500g</text>
</svg>
